aid: ascend-advanced-therapies
name: Ascend Advanced Therapies
description: >-
  Ascend Advanced Therapies is a gene-to-GMP contract development and manufacturing organization
  (CDMO) for advanced therapies, specializing in adeno-associated virus (AAV) vector development and
  manufacture for gene therapies, immunotherapies, oncolytics, and vaccines. Formed in 2023 when
  expert teams merged behind more than $130M of funding, and aligned with ABL, Inc. since late 2024,
  Ascend operates GMP manufacturing, aseptic fill-finish, and analytical facilities in Rockville,
  Maryland and Alachua, Florida alongside European capacity. Services span process development,
  gene therapy formulation, scalable manufacturing, in-house fill-finish, GMP QC testing, long-read
  NGS for viral vectors, and potency assay development, built on its EpyQ production system and
  proprietary AAV yield enhancers. Ascend is a life-science manufacturer rather than a software
  vendor and publishes no commercial product API; the only machine-readable interface it exposes is
  the WordPress REST content API behind its corporate website, captured here for discovery.
